<script>

window.GH_CONFIG = {owner:'mahdifallahazad7-bit', repo:'training', branch:'main'};

function calHTML(){
 const now=new Date(),t=jpt(now);let f=new Date(now);while(jpt(f).d!==1)f=new Date(f.getFullYear(),f.getMonth(),f.getDate()-1);
 const off=(f.getDay()+1)%7,cells=[...Array(off).fill(null)];let x=new Date(f);
 while(jpt(x).m===t.m){cells.push(jpt(x).d);x=new Date(x.getFullYear(),x.getMonth(),x.getDate()+1)}
 const wd=['ش','ی','د','س','چ','پ','ج'].map(w=>`<div class="mu" style="font-size:9px">${w}</div>`).join('');
 const dd=cells.map(c=>c===null?'<div></div>':`<div style="padding:2px 0;border-radius:6px;font-size:9px;${c===t.d?'background:var(--acc);color:#fff;font-weight:800':''}">${fa(c)}</div>`).join('');
 return `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center">${wd}${dd}</div>`;
}
function clkInner(){
 const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tehran',hour:'numeric',minute:'numeric',hour12:false}).formatToParts(new Date());
 const g=k=>+p.find(x=>x.type===k).value,pad=n=>String(n).padStart(2,'0');
 const dateStr=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{timeZone:'Asia/Tehran',weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());
 return `<div style="background:color-mix(in srgb,var(--card) 88%,transparent);border-radius:12px;padding:8px 10px;direction:rtl;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.2)"><div style="font-weight:800;font-size:18px;color:var(--pri)">${fa(pad(g('hour'))+':'+pad(g('minute')))}</div><div style="font-size:10px;font-weight:600;margin-top:2px">${esc(dateStr)}</div></div>`;
}
function clockW(){
 return `<div class="irw" style="position:relative;margin-bottom:14px;${(siteC.iran&&siteC.iran.w)?'width:'+siteC.iran.w+(siteC.iran.u==='%'?'%':'px')+';max-width:100%;':''}"><img src="${siteSrc('iran')}" alt="نقشه ایران" style="${(siteC.iran&&siteC.iran.w)?'width:100%;height:auto;':''}${(siteC.iran&&siteC.iran.h)?'height:'+siteC.iran.h+'px;object-fit:cover;':''}"><div id="clkbox" style="position:absolute;top:8px;left:8px;width:150px">${clkInner()}</div></div>`;

function galV(){const L=photos.filter(x=>!gc||x.course===gc);
const f=admin?`<div class="card" style="margin-top:14px"><b>افزودن عکس</b><div style="height:12px"></div>${csel2('id="g_c"','بدون دوره (عمومی)')}<input id="g_t" placeholder="توضیح عکس (اختیاری)"><input id="g_f" type="file" accept="image/*" multiple><button class="acc" data-a="upg" style="width:100%">بارگذاری عکس‌ها</button></div>`:'';

function resV(){const L=lib.filter(x=>!rc||x.course===rc);
const f=admin?`<div class="card" style="margin-top:14px"><b>افزودن جزوه، فیلم یا فایل</b><div style="height:12px"></div>${csel2('id="r_c"','بدون دوره (عمومی)')}<input id="r_t" placeholder="عنوان"><textarea id="r_n" placeholder="توضیح (اختیاری)"></textarea><input id="r_l" placeholder="لینک (اختیاری)"><input id="r_f" type="file" accept="image/*,application/pdf,video/mp4,video/webm,text/plain,text/csv,text/markdown"><div class="mu" style="margin-bottom:10px">فایل‌های مجاز: PDF، ویدیو (mp4 یا webm)، تصویر و متن؛ حداکثر ۴ مگابایت (عکس‌ها خودکار کوچک می‌شوند). برای فیلم یا فایل سنگین‌تر، فایل را در فضای ابری (مثل گوگل درایو یا آپارات) بگذارید و فقط لینکش را وارد کنید. فایل ورد و پاورپوینت را به PDF تبدیل کنید.</div><button class="acc" data-a="upr" style="width:100%">افزودن</button></div>`:'';
const show=x=>{const id=esc(x.asset||''),u=blobUrl(id),t=x.type||'',dl=`<button data-a="dl" data-id="${id}" data-n="${esc(x.title)}" data-t="${esc(t)}" style="margin-top:8px">دانلود فایل</button>`;return (x.asset?(t.startsWith('video/')?`<video controls preload="metadata" src="${u}" style="width:100%;border-radius:10px;margin-top:8px"></video>${dl}`:t.startsWith('image/')?`<img data-a="lbo" data-id="${id}" src="${u}" alt="${esc(x.title)}" style="width:100%;border-radius:10px;margin-top:8px;cursor:zoom-in"><div>${dl}</div>`:`<div>${dl}</div>`):'')+(/^https?:\/\//.test(x.link||'')?`<div><a href="${esc(x.link)}" target="_blank" rel="noopener" style="color:var(--acc);font-size:14px;display:inline-block;margin-top:8px">باز کردن لینک</a></div>`:'')};
return head('جزوه و فیلم‌های آموزشی','جزوه، فیلم آموزشی و فایل‌های هر دوره')+cfil('rc',rc)+(L.length?L.map(x=>`<div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(x.title)}</b></div><div class="mu">${esc(cnm(x.course))}</div>${x.note?`<div style="margin-top:6px;font-size:14px">${esc(x.note)}</div>`:''}${show(x)}${fdb('library',x.id)}</div>`).join(''):'<div class="card mu">هنوز موردی اضافه نشده است.</div>')+f+`<div class="mu" style="margin-top:8px">${esc(msg)}</div>`}
