<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{--bg:#F3F5F9;--card:#fff;--tx:#12263F;--mu:#5B6F86;--bd:#E3E8F0;--side:#12365A;--pri:#12365A;--acc:#E08A2B;--okb:#E4F2E7;--okt:#1E6B35;--nob:#FBE3E1;--not:#9B2C22;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1621;--card:#172231;--tx:#E6EDF5;--mu:#8DA0B8;--bd:#26354A;--side:#0A2038;--pri:#3F78AE;--okb:#173B25;--okt:#8FD9A5;--nob:#4A1F1B;--not:#F2A59D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1621;--card:#172231;--tx:#E6EDF5;--mu:#8DA0B8;--bd:#26354A;--side:#0A2038;--pri:#3F78AE;--okb:#173B25;--okt:#8FD9A5;--nob:#4A1F1B;--not:#F2A59D;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Vazirmatn',Tahoma,sans-serif}
.app{display:flex;min-height:100vh}.side{width:220px;background:var(--side);color:#fff;padding:28px 16px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.side b{font-size:20px}.side small{color:#A9BDD3;margin-bottom:18px}
.nav{padding:11px 14px;border-radius:10px;color:#D6E2EF;text-decoration:none;font-size:14px}.nav.on{background:var(--acc);color:#fff;font-weight:600}
.main{flex:1;padding:28px 32px;min-width:0}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
.row{display:flex;gap:14px;flex-wrap:wrap}.row>.card{flex:1;min-width:150px}.mu{color:var(--mu);font-size:13px}.big{font-size:30px;font-weight:800}
h1{margin:0 0 4px;font-size:24px}.bar{height:12px;background:var(--bd);border-radius:6px;margin:6px 0 14px}.bar i{display:block;height:12px;background:var(--pri);border-radius:6px}
button,select{font:600 14px 'Vazirmatn',Tahoma,sans-serif;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);min-height:44px;padding:0 16px}
.pri{background:var(--pri);color:#fff;border:0}.acc{background:var(--acc);color:#fff;border:0}
input,textarea{font:14px 'Vazirmatn',Tahoma,sans-serif;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);padding:10px 12px;width:100%;box-sizing:border-box;margin:0 0 10px}textarea{min-height:70px;resize:vertical}.p{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.ok{background:var(--okb);color:var(--okt)}.no{background:var(--nob);color:var(--not)}.chip{min-width:84px}
.sc{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0 18px}.sc button{padding:0}.sc .s{background:var(--pri);color:#fff;border:0}
@media (max-width:760px){.app{flex-direction:column}.side{width:auto;flex-direction:row;overflow-x:auto;padding:12px;gap:4px;align-items:center}.side small{display:none}.side b{margin-left:10px;white-space:nowrap}.nav{white-space:nowrap}.main{padding:18px 16px}}
.tp{position:fixed;inset-inline-start:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:16px;width:250px;box-shadow:0 8px 28px rgba(0,0,0,.25)}.tp[hidden]{display:none}.sw{width:38px;height:38px;min-height:38px;border-radius:50%;border:3px solid var(--card);padding:0}.sw.on{outline:3px solid var(--tx)}.md button.on,.ly button.on{background:var(--pri);color:#fff;border:0}.tp{max-height:80vh;overflow:auto}.nav{display:flex;align-items:center;gap:10px}.ic{display:none;width:20px;height:20px;flex-shrink:0}
[data-layout="office"] .app{flex-direction:column}
[data-layout="office"] .side{width:auto;flex-direction:row;align-items:center;gap:4px;background:var(--card);color:var(--tx);border-bottom:1px solid var(--bd);padding:0 24px;overflow-x:auto}
[data-layout="office"] .side b{color:var(--pri);margin-inline-end:20px;white-space:nowrap}
[data-layout="office"] .side small{display:none}
[data-layout="office"] .nav{color:var(--mu);border-radius:0;padding:20px 12px;white-space:nowrap}
[data-layout="office"] .nav.on{background:none;color:var(--pri);font-weight:800;box-shadow:inset 0 -3px 0 var(--pri)}
[data-layout="office"] .main{max-width:1000px;width:100%;margin:0 auto;box-sizing:border-box}
[data-layout="modern"] .card{border-radius:18px}
@media (min-width:761px){[data-layout="modern"] .side{width:84px;padding:22px 10px;align-items:center}[data-layout="modern"] .side b,[data-layout="modern"] .side small{display:none}[data-layout="modern"] .nav{width:56px;height:56px;padding:0;justify-content:center;gap:0;border-radius:14px}[data-layout="modern"] .nav .t{display:none}[data-layout="modern"] .nav .ic{display:block}}
[data-layout="cards"] .side{background:var(--card);color:var(--tx);border-inline-end:1px solid var(--bd)}
[data-layout="cards"] .side b{color:var(--pri)}
[data-layout="cards"] .side small,[data-layout="cards"] .nav{color:var(--mu)}
[data-layout="cards"] .nav.on{background:color-mix(in srgb,var(--pri) 13%,transparent);color:var(--pri);font-weight:800}
[data-layout="cards"] .nav .ic{display:block}
[data-layout="cards"] .card{border-radius:18px;border:0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
[data-layout="cards"] .big{color:var(--pri)}
[data-layout="cards"] .row>.card:nth-child(4n+1){background:color-mix(in srgb,var(--pri) 10%,var(--card))}
[data-layout="cards"] .row>.card:nth-child(4n+2){background:color-mix(in srgb,var(--acc) 12%,var(--card))}
</style></head><body>
<div class="app"><nav class="side"><b>واحد آموزش</b><small>ایستانوآوران نیرو</small><a class="nav" href="#dash" data-v="dash" title="داشبورد"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg><span class="t">داشبورد</span></a><a class="nav" href="#courses" data-v="courses" title="دوره‌های آموزشی"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2zM4 19a2 2 0 012-2h13"/></svg><span class="t">دوره‌های آموزشی</span></a><a class="nav" href="#catalog" data-v="catalog" title="دوره‌های مورد نیاز"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span class="t">دوره‌های مورد نیاز</span></a><a class="nav" href="#ev" data-v="ev" title="ارزیابی اولیه"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v3H9zM6 6H5a1 1 0 00-1 1v13a1 1 0 001 1h14a1 1 0 001-1V7a1 1 0 00-1-1h-1M8 13l2 2 4-4"/></svg><span class="t">ارزیابی اولیه</span></a><a class="nav" href="#att" data-v="att" title="حضور و غیاب"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg><span class="t">حضور و غیاب</span></a><a class="nav" href="#survey" data-v="survey" title="نظرسنجی‌ها"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg><span class="t">نظرسنجی‌ها</span></a><a class="nav" href="#people" data-v="people" title="شناسنامه آموزشی"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0"/></svg><span class="t">شناسنامه آموزشی</span></a><a class="nav" href="#lib" data-v="lib" title="کتابخانه"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h6a3 3 0 013 3v12a2 2 0 00-2-2H3zM21 5h-6a3 3 0 00-3 3v12a2 2 0 012-2h7z"/></svg><span class="t">کتابخانه</span></a><a class="nav" href="#gallery" data-v="gallery" title="گالری عکس"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v14H3zM3 16l5-5 4 4 3-3 6 6"/></svg><span class="t">گالری عکس</span></a><a class="nav" href="#res" data-v="res" title="جزوه و فیلم"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM9 12h7M9 16h7"/></svg><span class="t">جزوه و فیلم</span></a><button class="nav" data-a="tp" style="margin-top:auto;border:0;background:transparent;text-align:start;min-height:0;font-weight:400" title="رنگ و ظاهر"><span>🎨</span><span class="t"> رنگ و ظاهر</span></button></nav><main class="main" id="m"></main></div><div class="tp" id="tp" hidden><b style="font-size:14px">رنگ برنامه</b><div id="sw" style="display:flex;gap:10px;margin:12px 0 16px"></div><b style="font-size:14px">چیدمان</b><div class="ly" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 16px"><button data-a="lay" data-v="classic" style="padding:0">کلاسیک</button><button data-a="lay" data-v="office" style="padding:0">اداری</button><button data-a="lay" data-v="modern" style="padding:0">مدرن</button><button data-a="lay" data-v="cards" style="padding:0">کارتی</button></div><b style="font-size:14px">حالت نمایش</b><div class="md" style="display:flex;gap:6px;margin-top:10px"><button data-a="mode" data-v="light" style="flex:1;padding:0">روشن</button><button data-a="mode" data-v="dark" style="flex:1;padding:0">تیره</button><button data-a="mode" data-v="auto" style="flex:1;padding:0">خودکار</button></div><div class="mu" style="margin-top:10px">فقط روی همین دستگاه ذخیره می‌شود.</div></div>
<script>
/* ===== تنظیمات گیت‌هاب: نام کاربری و نام repo ===== 
   اگر null بماند یا فایل مستقیم از گوشی باز شود، «حالت محلی» (فقط همان دستگاه) فعال است. */
window.GH_CONFIG = {owner:'mahdifallahazad7-bit', repo:'training', branch:'main'};
(function(){
  const C=window.GH_CONFIG, GH=!!C&&/^https?:/.test(location.protocol);
  const rid=()=>Array.from(crypto.getRandomValues(new Uint8Array(10))).map(b=>b.toString(16).padStart(2,'0')).join('');
  const enc=s=>btoa(unescape(encodeURIComponent(s))), cache={}, pend={}, subs=[];
  let S={}, admin=!GH, token=(()=>{try{return localStorage.getItem('ea_gh_token')||''}catch(e){return''}})(), tm=0, ver=0, saved=0, saving=false, st=0, btn=null;
  const refresh=()=>{clearTimeout(tm);tm=setTimeout(()=>{try{window.render&&window.render(true)}catch(e){}},150)};
  const snap=p=>({docs:Object.entries(S[p]||{}).map(([id,v])=>({id,data:()=>v}))});
  const fire=p=>subs.filter(x=>x.p===p).forEach(x=>x.f(snap(p)));
  const fireAll=()=>[...new Set(subs.map(x=>x.p))].forEach(fire);
  const API=p=>'https://api.github.com/repos/'+C.owner+'/'+C.repo+'/contents/'+p;
  const hd=(a)=>({Accept:a||'application/vnd.github+json',Authorization:'Bearer '+token,'Content-Type':'application/json'});
  const fT=(u,o,ms)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||8000);return fetch(u,{...(o||{}),signal:c.signal}).finally(()=>clearTimeout(t))};
  async function getText(path){
    let r=null;
    if(token){try{r=await fT(API(path)+'?ref='+C.branch+'&t='+Date.now(),{headers:hd('application/vnd.github.raw+json')})}catch(e){r=null}}
    if(!r||(!r.ok&&r.status!==404))r=await fT(path+'?t='+Date.now());
    if(r.status===404)return null; if(!r.ok)throw 0; return r.text();
  }
  async function put(path,text){
    const m=await fetch(API(path)+'?ref='+C.branch,{headers:hd()}); const body={message:'update',content:enc(text),branch:C.branch};
    if(m.ok)body.sha=(await m.json()).sha; const r=await fetch(API(path),{method:'PUT',headers:hd(),body:JSON.stringify(body)}); if(!r.ok)throw 0;
  }
  async function del(path){const m=await fetch(API(path)+'?ref='+C.branch,{headers:hd()});if(!m.ok)return;await fetch(API(path),{method:'DELETE',headers:hd(),body:JSON.stringify({message:'delete',sha:(await m.json()).sha,branch:C.branch})})}
  function persist(){
    if(!GH){try{localStorage.setItem('ea_local_db',JSON.stringify(S))}catch(e){alert('حافظه دستگاه پر است.')}return}
    ver++;clearTimeout(st);st=setTimeout(flush,700);
  }
  async function flush(){
    if(saving){st=setTimeout(flush,700);return} saving=true; const v=ver;
    try{await put('data.json',JSON.stringify(S));saved=v}catch(e){alert('ذخیره در گیت‌هاب انجام نشد. اینترنت یا توکن را بررسی کنید.')}
    saving=false; if(saved<ver&&saved===v)flush();
  }
  async function load(){
    if(ver>saved)return;
    try{const t=await getText('data.json');const n=JSON.parse(t||'{}');if(JSON.stringify(n)!==JSON.stringify(S)){S=n;fireAll()}}catch(e){}
  }
  const need=()=>{if(GH&&!admin)throw new Error('no-permission')};
  const part=p=>{const i=p.lastIndexOf('/');return[p.slice(0,i),p.slice(i+1)]};
  const db={
    collection:p=>({onSnapshot(f){subs.push({p,f});setTimeout(()=>f(snap(p)),0)},async add(v){need();(S[p]=S[p]||{})[rid()]=JSON.parse(JSON.stringify(v));fire(p);persist()}}),
    doc:p=>{const[c,id]=part(p);return{async set(v){need();(S[c]=S[c]||{})[id]=JSON.parse(JSON.stringify(v));fire(c);persist()},async delete(){need();if(S[c])delete S[c][id];fire(c);persist()}}}
  };
  window.blobUrl=id=>{
    if(!id)return''; if(cache[id])return cache[id];
    if(!GH){const b=(S._blobs||{})[id];return b?b.data:''}
    if(!pend[id]){pend[id]=1;getText('blobs/'+id+'.json').then(t=>{if(t){cache[id]=JSON.parse(t).data;refresh()}else pend[id]=0}).catch(()=>{pend[id]=0})}
    return'';
  };
  const MAX=4*1024*1024, IMG=900*1024;
  const rd=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
  async function shrink(f){
    const url=await rd(f), img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    let sc=Math.min(1,1600/Math.max(img.width,img.height)),q=.8;
    for(let k=0;k<6;k++){const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const o=c.toDataURL('image/jpeg',q);if(o.length<IMG)return o;sc*=.8;q=Math.max(.5,q-.08)}
    throw{code:'too_large'};
  }
  const assets={
    async upload(f){
      need(); const isImg=/^image\/(jpeg|png|webp)/.test(f.type); let data;
      if(isImg)data=await shrink(f); else{data=await rd(f);if(data.length>MAX)throw{code:'too_large'}}
      const id=rid(), type=isImg?'image/jpeg':f.type, rec={data,type,at:Date.now()};
      if(GH)await put('blobs/'+id+'.json',JSON.stringify(rec)); else{(S._blobs=S._blobs||{})[id]=rec;persist()}
      cache[id]=data; refresh(); return{id,url:data,sizeBytes:data.length,contentType:type};
    },
    async delete(id){need();delete cache[id];if(GH)await del('blobs/'+id+'.json');else{if(S._blobs)delete S._blobs[id];persist()}}
  };
  const downloads={async save({filename,data}){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}};

  window.__authReady=(async()=>{
    if(!GH){try{S=JSON.parse(localStorage.getItem('ea_local_db')||'{}')}catch(e){}return}
    let neterr=false;
    if(token){try{const r=await fT('https://api.github.com/repos/'+C.owner+'/'+C.repo,{headers:hd()});admin=r.ok&&!!(await r.json()).permissions?.push}catch(e){admin=false;neterr=true}if(!admin)token=''}
    btn=document.createElement('button');
    btn.style.cssText='position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:50;padding:6px 12px;border-radius:8px;border:1px solid #8884;background:#fff;color:#12263F;font:12px Vazirmatn,Tahoma;opacity:.85';
    btn.textContent=admin?'قفل کردن (خروج مدیر)':(neterr?'ورود مدیر (اتصال به گیت‌هاب برقرار نیست؛ لمس کنید)':'ورود مدیر');
    const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))), ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
    const dk=async(pw,salt)=>{const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])};
    const lockTok=async(t,pw)=>{const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await dk(pw,salt),new TextEncoder().encode(t));return JSON.stringify([b64(salt),b64(iv),b64(ct)])};
    const openTok=async(s,pw)=>{const[x,y,z]=JSON.parse(s).map(ub);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:y},await dk(pw,x),z))};
    const canPush=async t=>{const r=await fT('https://api.github.com/repos/'+C.owner+'/'+C.repo,{headers:{Authorization:'Bearer '+t}});return r.ok&&!!(await r.json()).permissions?.push};
    btn.onclick=async()=>{
      if(neterr){location.reload();return}
      if(admin){try{localStorage.removeItem('ea_gh_token')}catch(e){}location.reload();return}
      try{
        let enc=localStorage.getItem('ea_gh_enc'), t='';
        if(enc){
          const pw=prompt('رمز مدیر را وارد کنید:\n(اگر فراموش کردید، کلمه «توکن» را بنویسید)'); if(!pw)return;
          if(pw.trim()!=='توکن'){try{t=await openTok(enc,pw)}catch(e){alert('رمز اشتباه است.');return}}
          else{localStorage.removeItem('ea_gh_enc');enc=null}
        }
        if(!t){t=(prompt('توکن گیت‌هاب را وارد کنید:')||'').trim();if(!t)return}
        if(!(await canPush(t))){alert('این توکن اجازه نوشتن در این repo را ندارد.');return}
        if(!enc){const pw=prompt('یک رمز کوتاه برای ورودهای بعدی انتخاب کنید (دفعه بعد فقط همین را می‌زنید):');if(pw)localStorage.setItem('ea_gh_enc',await lockTok(t,pw))}
        localStorage.setItem('ea_gh_token',t);location.reload();
      }catch(e){alert('اتصال به گیت‌هاب برقرار نشد.')}
    };
    document.addEventListener('DOMContentLoaded',()=>document.body.appendChild(btn));
    if(document.body)document.body.appendChild(btn);
    load(); setInterval(load,60000); document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
  })();
  window.EV=null; if(GH)window.__authReady.then(()=>{if(!admin)return;return fetch('evals.json?t='+Date.now()).then(r=>r.ok?r.json():null).then(j=>{window.EV=j;refresh()})}).catch(()=>{});
  window.claude={async use(n){
    await window.__authReady;
    if(n==='db')return db; if(n==='assets')return assets; if(n==='downloads')return downloads;
    if(n==='user')return{canEdit:async()=>admin,isOwner:()=>admin};
    return null;
  }};
})();
